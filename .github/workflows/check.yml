name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run rules:update -- --check
  routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 Tools/fetch-mihomo.py --output .test-runtime/tools/mihomo
      - run: npm run test:routing -- --mihomo .test-runtime/tools/mihomo
      - run: npm run test:groups -- --mihomo .test-runtime/tools/mihomo
      - run: npm run test:ai-udp -- --mihomo .test-runtime/tools/mihomo
      - run: npm run test:dns-behavior -- --mihomo .test-runtime/tools/mihomo
